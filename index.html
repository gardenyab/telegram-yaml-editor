<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gardi Locales</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&family=Google+Sans+Flex:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      /* Динамические цвета Telegram с fallback'ом на оригинальную палитру */
      --bg-color: var(--tg-theme-bg-color, #0e0f13);
      --bg-elev: var(--tg-theme-secondary-bg-color, #121319);
      --panel-bg: var(--tg-theme-secondary-bg-color, #16181f);
      --panel-light: var(--tg-theme-bg-color, #1e212b);
      --text-color: var(--tg-theme-text-color, #e7e9ee);
      --text-muted: var(--tg-theme-hint-color, #9198a6);
      --accent-color: var(--tg-theme-button-text-color, #ffffff);
      --border-color: var(--tg-theme-section-separator-color, #262a35);
      --item-hover: var(--tg-theme-secondary-bg-color, #1c1f29);
      --input-bg: var(--tg-theme-bg-color, #0d0e12);

      --accent: var(--tg-theme-button-color, #3b9eff);
      --accent-hover: var(--tg-theme-button-color, #59aeff);
      --accent-soft: rgba(59, 158, 255, 0.12); /* Прозрачный акцент, можно оставить как есть */
      
      --danger: var(--tg-theme-destructive-text-color, #ff6b6b);
      --warn: #ffcf5c;

      --font-ui: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Google Sans Code', 'Consolas', 'Fira Code', 'Courier New', monospace;

      --radius: 10px;
      --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.35);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

      /* Документ-превью («бумажная» страница статьи) */
      --doc-bg: var(--tg-theme-secondary-bg-color, #fbfbf7);
      --doc-text: var(--tg-theme-text-color, #1f2328);
      --doc-muted: var(--tg-theme-hint-color, #656d76);
      --doc-border: var(--tg-theme-section-separator-color, #e2e2da);
      --doc-soft: var(--tg-theme-bg-color, #f2f2ec);
      --doc-link: var(--tg-theme-link-color, #1a66d6);
      --doc-accent: var(--tg-theme-button-color, #3b9eff);
      --doc-code-bg: var(--tg-theme-bg-color, #eef0ee);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection { background: var(--accent-soft); }

    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
      border: 3px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: content-box; }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-variation-settings: 'wght' 400;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Header ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-color);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 0.55rem;
      letter-spacing: 0.2px;
    }
    
    .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

    .btn, select.btn {
      background-color: var(--panel-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s var(--ease), background-color 0.2s, border-color 0.2s;
    }
    select.btn {
      appearance: none;
      padding-right: 2rem;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239198a6%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 0.7rem top 50%;
      background-size: 0.65rem auto;
    }
    .btn:hover, select.btn:hover { background-color: var(--item-hover); border-color: var(--text-muted); transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-color);
      font-weight: 600;
      border: none;
    }
    .btn-primary:hover { filter: brightness(1.07); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #file-input { display: none; }

    main { flex: 1; padding: 1.5rem; overflow-y: auto; }

    /* ---------- Панель управления деревом ---------- */
    .tree-controls {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      animation: fadeUp 0.4s var(--ease) both;
    }
    #tree-search {
      flex: 1;
      min-width: 220px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.6rem 0.9rem;
      border-radius: 9px;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      outline: none;
    }
    #tree-search:focus { border-color: var(--accent); }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.8rem;
      border-radius: 9px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .stat-chip b { color: var(--text-color); font-weight: 600; }

    /* Баннер о дубликатах */
    .banner {
      display: none;
      margin-bottom: 1rem;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      background: rgba(255, 207, 92, 0.1);
      border: 1px solid rgba(255, 207, 92, 0.35);
      color: #ffe6a1;
      font-size: 0.86rem;
      line-height: 1.5;
      animation: fadeUp 0.4s var(--ease) both;
    }
    .banner.show { display: block; }

    .tree-node {
      margin-left: 1.1rem;
      border-left: 1px dashed var(--border-color);
      padding-left: 0.8rem;
      margin-top: 0.2rem;
    }

    /* Разворачиваемые узлы */
    details > summary {
      cursor: pointer;
      color: var(--text-color);
      font-weight: 600;
      padding: 0.4rem 0.55rem;
      border-radius: 7px;
      font-family: var(--font-ui);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.15rem;
      list-style: none;
      user-select: none;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary:hover { background-color: var(--item-hover); }
    .chev {
      display: inline-block;
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-right: 0.35rem;
      transition: transform 0.2s var(--ease);
    }
    details[open] > summary .chev { transform: rotate(90deg); }
    .sum-key { color: var(--text-color); }
    .sum-count {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      margin-left: 0.45rem;
      padding: 0.05rem 0.4rem;
      border-radius: 20px;
      background: var(--accent-soft);
    }

    /* Листовые ключи */
    .node-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.55rem 0.85rem;
      margin: 0.28rem 0;
      border-radius: 9px;
      cursor: pointer;
      overflow: hidden;
      font-family: var(--font-ui);
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      transition: transform 0.16s var(--ease), background-color 0.2s;
    }
    .node-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform 0.18s var(--ease);
    }
    .node-item:hover { background-color: var(--item-hover); transform: translateX(3px); }
    .node-item:hover::before { transform: scaleY(1); }

    .node-key { color: var(--text-color); font-weight: 600; white-space: nowrap; }
    .node-preview {
      color: var(--text-muted);
      flex: 1;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.85rem;
    }
    .node-edit {
      color: var(--accent);
      font-size: 0.85rem;
      opacity: 0;
      transform: translateX(4px);
      transition: opacity 0.18s, transform 0.18s;
    }
    .node-item:hover .node-edit { opacity: 1; transform: translateX(0); }

    .entry { animation: itemIn 0.4s var(--ease) both; }
    @keyframes itemIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- Модальное окно ---------- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
    }
    .modal.active { display: flex; animation: overlayIn 0.2s ease both; }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-card {
      width: 100%;
      height: 100%;
      background-color: var(--bg-elev);
      display: flex;
      flex-direction: column;
      animation: modalIn 0.28s var(--ease) both;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }

    .modal-header {
      background-color: var(--panel-bg);
      padding: 0.8rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      gap: 1rem;
    }
    .modal-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar-container {
      background-color: var(--panel-bg);
      padding: 0.6rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .tab-switch {
      display: flex;
      position: relative;
      background-color: var(--input-bg);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border-color);
    }
    .tab-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.9rem;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
    }
    .tab-btn.active { color: var(--text-color); }
    .tab-indicator {
      position: absolute;
      top: 3px; bottom: 3px;
      border-radius: 6px;
      background: var(--panel-light);
      transition: transform 0.25s var(--ease), width 0.25s var(--ease);
    }

    .modal-body { flex: 1; padding: 1.3rem; display: flex; flex-direction: column; min-height: 0; }

    .modal-editor {
      flex: 1;
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      outline: none;
      resize: none;
    }
    .modal-editor:focus { border-color: var(--accent); }

    .modal-preview {
      flex: 1;
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-y: auto;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      background-color: var(--input-bg);
    }

    .empty-state { text-align: center; margin-top: 4rem; color: var(--text-muted); line-height: 1.9; animation: fadeUp 0.5s var(--ease) both; }
    .empty-state .big { font-size: 2.6rem; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Gardi Locales</h1>
    <div class="controls" id="app-controls">
      <select id="preset-select" class="btn">
        <option value="none" disabled selected>Presets</option>
        <option value="https://raw.githubusercontent.com/gardenyab/telegram-yaml-editor/refs/heads/main/ru.yaml">Русский</option>
        <option value="https://raw.githubusercontent.com/gardenyab/telegram-yaml-editor/refs/heads/main/eng.yaml">English</option>
        <option value="https://raw.githubusercontent.com/gardenyab/telegram-yaml-editor/refs/heads/main/ua.yaml">Українська</option>
      </select>
      
      <input type="file" id="file-input" accept=".yaml,.yml">
      <button class="btn" onclick="document.getElementById('file-input').click();">+</button>
      <button class="btn btn-primary" id="global-save" onclick="saveAllChanges()">Save all</button>
    </div>
  </header>

  <main>
    <div class="banner" id="dup-banner"></div>

    <div class="tree-controls hidden" id="tree-controls">
      <input type="text" id="tree-search" placeholder="Search keys or values">
      <span class="stat-chip" id="stat-chip">Keys: <b id="stat-count">0</b></span>
    </div>

    <div id="tree-container">
      <div class="empty-state">
        <div class="big">📄</div>
        <div>Select a preset or load your own file.</div>
      </div>
    </div>
  </main>

  <div class="modal" id="editor-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modal-key-path">Key: <b>key</b></div>
        <div class="controls">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveModalValue()">Save</button>
        </div>
      </div>

      <div class="toolbar-container">
        <div class="tab-switch">
          <div class="tab-indicator" id="tab-indicator"></div>
          <button class="tab-btn active" id="btn-mode-edit" onclick="switchMode('edit')">HTML Code</button>
          <button class="tab-btn" id="btn-mode-preview" onclick="switchMode('preview')">Preview</button>
        </div>
      </div>

      <div class="modal-body">
        <textarea class="modal-editor" id="modal-textarea" placeholder="Enter text..."></textarea>
        <div class="modal-preview hidden" id="modal-preview"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    let parsedData = null;
    let originalData = null;
    let currentFileName = 'config.yaml';
    let activeTarget = null;
    let isCustom = false;

    const presetSelect = document.getElementById('preset-select');
    const fileInput = document.getElementById('file-input');
    const treeContainer = document.getElementById('tree-container');
    const treeControls = document.getElementById('tree-controls');
    const treeSearch = document.getElementById('tree-search');
    const statCount = document.getElementById('stat-count');
    const dupBanner = document.getElementById('dup-banner');
    
    const modal = document.getElementById('editor-modal');
    const modalKeyPath = document.getElementById('modal-key-path');
    const modalTextarea = document.getElementById('modal-textarea');
    const modalPreview = document.getElementById('modal-preview');
    const tabIndicator = document.getElementById('tab-indicator');

    /* ---------- Загрузка пресетов ---------- */
    presetSelect.addEventListener('change', async (e) => {
      const url = e.target.value;
      if (url === 'none') return;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Ошибка сети при загрузке пресета');
        const text = await res.text();
        currentFileName = url.split('/').pop();
        isCustom = false
        loadYAMLString(text);
      } catch (err) {
        alert('Не удалось загрузить пресет: ' + err.message);
      }
    });

    /* ---------- Загрузка своего файла ---------- */
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        presetSelect.value = 'none'; // Сброс селектора пресетов
        currentFileName = file.name;
        const reader = new FileReader();
        reader.onload = (ev) => {
            isCustom = true
            loadYAMLString(ev.target.result)
        };
        reader.readAsText(file, 'UTF-8');
      }
      fileInput.value = ''; 
    });

    function loadYAMLString(yamlString) {
      let data;
      try {
        data = jsyaml.load(yamlString);
      } catch (err) {
        try {
          data = jsyaml.load(yamlString, { json: true });
        } catch (e2) {
          alert('Ошибка синтаксиса YAML: ' + e2.message);
          return;
        }
      }
      parsedData = data;
      originalData = deepClone(data);
      renderTree();
    }

    function cleanPreview(val) {
      if (val === null) return '~ (пусто)';
      if (val === undefined) return '';
      return String(val).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
    }

    function countAllKeys(o) {
      let n = 0;
      for (const k in o) {
        if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
        n++;
        const v = o[k];
        if (v && typeof v === 'object') n += countAllKeys(v);
      }
      return n;
    }

    /* ---------- Рендер дерева ---------- */
    function renderTree() {
      treeContainer.innerHTML = '';
      const hasData = parsedData !== null && typeof parsedData === 'object';
      treeControls.classList.toggle('hidden', !hasData);

      if (!hasData) {
        treeContainer.innerHTML = '<div class="empty-state">Пустой или некорректный файл</div>';
        return;
      }
      statCount.textContent = countAllKeys(parsedData);
      treeContainer.appendChild(buildTree(parsedData, ''));
      if (treeSearch.value.trim()) filterTree(treeSearch.value.trim().toLowerCase());
    }

    function buildTree(data, path) {
      const fragment = document.createDocumentFragment();
      for (const key in data) {
        if (!Object.prototype.hasOwnProperty.call(data, key)) continue;

        const val = data[key];
        const currentPath = path ? `${path} → ${key}` : String(key);
        const entry = document.createElement('div');
        entry.className = 'entry';

        if (val !== null && typeof val === 'object') {
          const details = document.createElement('details');
          details.open = true;

          const summary = document.createElement('summary');
          summary.dataset.key = String(key).toLowerCase();
          const count = Array.isArray(val) ? `[${val.length}]` : `{${Object.keys(val).length}}`;
          summary.innerHTML =
            `<span class="chev">▶</span>` +
            `<span class="sum-key">${key}</span>` +
            `<span class="sum-count">${count}</span>`;

          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'tree-node';
          childrenContainer.appendChild(buildTree(val, currentPath));

          details.appendChild(summary);
          details.appendChild(childrenContainer);
          entry.appendChild(details);
        } else {
          const nodeItem = document.createElement('div');
          nodeItem.className = 'node-item';
          nodeItem.dataset.search = (String(key) + ' ' + String(val ?? '')).toLowerCase();

          const keySpan = document.createElement('span');
          keySpan.className = 'node-key';
          keySpan.textContent = key;

          const previewSpan = document.createElement('span');
          previewSpan.className = 'node-preview';
          previewSpan.textContent = cleanPreview(val);

          const edit = document.createElement('span');
          edit.className = 'node-edit';
          edit.textContent = '✎';

          nodeItem.appendChild(keySpan);
          nodeItem.appendChild(previewSpan);
          nodeItem.appendChild(edit);
          nodeItem.addEventListener('click', () => openModal(data, key, currentPath, previewSpan, nodeItem));
          entry.appendChild(nodeItem);
        }
        fragment.appendChild(entry);
      }
      return fragment;
    }

    /* ---------- Поиск / сворачивание ---------- */
    function filterTree(term) {
      treeContainer.querySelectorAll(':scope > .entry').forEach((entry) => matchEntry(entry, term));
    }
    function matchEntry(entry, term) {
      const details = entry.querySelector(':scope > details');
      if (details) {
        const summary = details.querySelector(':scope > summary');
        const keyMatch = (summary.dataset.key || '').includes(term);
        let childMatch = false;
        details.querySelectorAll(':scope > .tree-node > .entry').forEach((child) => {
          if (matchEntry(child, term)) childMatch = true;
        });
        const visible = term === '' || keyMatch || childMatch;
        entry.style.display = visible ? '' : 'none';
        if (term !== '') details.open = keyMatch || childMatch;
        return visible;
      }
      const item = entry.querySelector(':scope > .node-item');
      const visible = term === '' || (item.dataset.search || '').includes(term);
      entry.style.display = visible ? '' : 'none';
      return visible;
    }

    treeSearch.addEventListener('input', () => filterTree(treeSearch.value.trim().toLowerCase()));
    document.getElementById('expand-all').addEventListener('click', () => {
      treeContainer.querySelectorAll('details').forEach((d) => (d.open = true));
    });
    document.getElementById('collapse-all').addEventListener('click', () => {
      treeContainer.querySelectorAll('details').forEach((d) => (d.open = false));
    });

    /* ---------- Вкладки и модалка ---------- */
    function moveTabIndicator(activeBtn) {
      tabIndicator.style.width = activeBtn.offsetWidth + 'px';
      tabIndicator.style.transform = `translateX(${activeBtn.offsetLeft - 3}px)`;
    }

    function switchMode(mode) {
      const editBtn = document.getElementById('btn-mode-edit');
      const previewBtn = document.getElementById('btn-mode-preview');

      if (mode === 'preview') {
        let text = modalTextarea.value;
        text = text.replace(/<tg-emoji[^>]*>(.*?)<\/tg-emoji>/g, '$1');
        text = text.replace(/\n+"/g, '"').replace(/"\n+/g, '"');
        text = "Currently unavailable."
        modalPreview.innerHTML = text;
        modalPreview.style.whiteSpace = 'pre-wrap';
        modalPreview.style.textAlign = 'left';
        modalTextarea.classList.add('hidden');
        modalPreview.classList.remove('hidden');
        previewBtn.classList.add('active');
        editBtn.classList.remove('active');
        moveTabIndicator(previewBtn);
      } else {
        modalTextarea.classList.remove('hidden');
        modalPreview.classList.add('hidden');
        editBtn.classList.add('active');
        previewBtn.classList.remove('active');
        moveTabIndicator(editBtn);
      }
    }

    function openModal(parentObject, key, fullPath, previewEl, nodeItem) {
      newPath = fullPath.slice(0, 15);
      if (fullPath != newPath) {
        newPath += "...";
      }
      activeTarget = { obj: parentObject, key, previewEl, nodeItem };
      modalKeyPath.innerHTML = '<b>' + newPath + '</b>';
      const v = parentObject[key];
      modalTextarea.value = v === undefined || v === null ? '' : String(v);
      switchMode('edit');
      modal.classList.add('active');
      requestAnimationFrame(() => moveTabIndicator(document.getElementById('btn-mode-edit')));
      modalTextarea.focus();
    }

    function closeModal() {
      modal.classList.remove('active');
      activeTarget = null;
    }

    function saveModalValue() {
      if (activeTarget) {
        const raw = modalTextarea.value;
        const orig = activeTarget.obj[activeTarget.key];
        let out = raw;

        if (typeof orig === 'boolean') {
          out = raw === 'true' ? true : raw === 'false' ? false : raw;
        } else if (typeof orig === 'number') {
          const n = Number(raw);
          out = raw.trim() !== '' && !isNaN(n) && String(n) === raw.trim() ? n : raw;
        }
        
        activeTarget.obj[activeTarget.key] = out;

        if (activeTarget.previewEl) {
          activeTarget.previewEl.textContent = cleanPreview(out);
        }
      }
      closeModal();
    }

    function deepClone(value) {
      if (value === undefined) return undefined;
      return JSON.parse(JSON.stringify(value));
    }

    function valuesEqual(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);
    }

    // Возвращает только изменённые конечные (листовые) ключи.
    function collectChangedKeys(current, original, result = []) {
      if (!current || typeof current !== 'object') return result;

      const originalObj = (original && typeof original === 'object') ? original : {};

      for (const key of Object.keys(current)) {
        const currentValue = current[key];
        const originalValue = originalObj[key];

        if (currentValue !== null && typeof currentValue === 'object') {
          collectChangedKeys(currentValue, originalValue, result);
        } else if (!valuesEqual(currentValue, originalValue)) {
          result.push({
            key: key,
            value: currentValue
          });
        }
      }

      return result;
    }

    function saveAllChanges() {
      if (!parsedData || !originalData) return;

      const changedKeys = collectChangedKeys(parsedData, originalData);

      if (changedKeys.length === 0 && isCustom) {
        alert('Нет изменённых ключей.');
        return;
      }

      const tgUserId = tg.initDataUnsafe?.user?.id || 'local_user';

      const dataToSend = JSON.stringify({
        userId: tgUserId,
        changes: changedKeys
      });

      tg.sendData(dataToSend);

      // После отправки текущее состояние становится новым исходным.
      originalData = deepClone(parsedData);
    }

    document.getElementById('global-save').addEventListener('click', saveAllChanges);

  </script>
</body>
