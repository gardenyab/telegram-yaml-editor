nowPlayingAccountNotConnected: |
    <tg-emoji emoji-id="5879813604068298387">❗️</tg-emoji> <b>Акаунт не підключено!</b>

    <blockquote>Як прив'язати? Перейдіть у Налаштування &gt; 🔧 Мої налаштування &gt; 🎧 "Зараз грає" &gt; Прив'язати акаунт &gt; Введіть ваш юзернейм Last.fm. </blockquote>
    <blockquote expandable><b>Як підключити музичні сервіси?
    На Android/iOS:</b>
    1. Увімкніть будь-яку пісню у своєму сервісі
    2. Відкрийте додаток <b>Last.fm</b>
    3. Натисніть на аватар у головному меню
    4. Переведіть перемикач поруч із вашим музичним сервісом у зелений стан
    5. Вуаля, усе готово!
    <b>На Windows/Linux/MacOS:</b>
    1. Встановіть розширення для <b>Chrome/Firefox</b> під назвою <b>Web Scrobbler</b>
    2. Зайдіть у налаштування розширення
    3. Відкрийте вкладку <b>Accounts</b> і увійдіть під своїм акаунтом <b>Last.fm</b>
    4. Вуаля, усе готово!</blockquote>
