nowPlayingAccountNotConnected: |
    <tg-emoji emoji-id="5879813604068298387">❗️</tg-emoji> <b>Account not connected!</b>

    <blockquote>How to link it? Go to Settings &gt; 🔧 My Settings &gt; 🎧 "Now Playing" &gt; Link Account &gt; Enter your Last.fm username. </blockquote>
    <blockquote expandable><b>How to link music services?
    On Android/iOS:</b>
    1. Play any song in your service
    2. Open the <b>Last.fm</b> app
    3. Tap your avatar in the main menu
    4. Toggle the switch next to your music service to green
    5. Voila, all set!
    <b>On Windows/Linux/MacOS:</b>
    1. Install the extension for <b>Chrome/Firefox</b> called <b>Web Scrobbler</b>
    2. Go to extension settings
    3. Open the <b>Accounts</b> tab and log in with your <b>Last.fm</b> account
    4. Voila, all set!</blockquote>
