nowPlayingAccountNotConnected: |
    <tg-emoji emoji-id="5879813604068298387">❗️</tg-emoji> <b>Вы не подключили свой аккаунт!</b>

    <blockquote>Как подключить его? Перейдите в Настройки &gt; 🔧 Мои настройки &gt; 🎧 "Сейчас играет" &gt; Привязать аккаунт &gt; Введите ваш юзернейм из Last.fm. </blockquote>
    <blockquote expandable><b>Как подключить музыкальные сервисы?
    На Android/iOS:</b>
    1. Включите любую песню в вашем сервисе
    2. Зайдите в приложение <b>Last.fm</b>
    3. Нажмите на вашу аватарку в главно меню
    4. Переключите тумблер около вашего музыкального сервиса, чтобы он был зеленым
    5. Вуаля, все готово!
    <b>На Windows/Linux/MacOS:</b>
    1. Установите дополнение для <b>Chrome/Firefox</b> под названием <b>Web Scrobbler</b>
    2. Зайдите в настройки дополнения
    3. Зайдите во вкладку <b>Accounts</b> и войдите со своего <b>Last.fm</b> аккаунта
    4. Вуаля, все готово!</blockquote>
