antispamInfo: |
    <tg-emoji emoji-id="5778423822940114949">🛡</tg-emoji> <b>Antispam System</b>

    <blockquote>•. Protection against unwanted users (spammers, scammers, etc.) that filters suspicious messages and restricts chat access for violators.</blockquote>
    <blockquote>•. To report a user, reply to their message with the /report command – we will review the complaint and take action!</blockquote>
    <blockquote>•. If your account ended up in the antispam system, the bot will ignore ALL your commands and automatically restrict you in groups upon joining if protection is enabled. You can only rejoin the chat after the ban is lifted if the group owner permits re-adding.</blockquote>
