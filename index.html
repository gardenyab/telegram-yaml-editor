<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Yaml Editor</title>

  <!-- Google Sans Flex (интерфейс) + Google Sans Code (моноширинный код) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&family=Google+Sans+Flex:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-color: #0e0f13;
      --bg-elev: #121319;
      --panel-bg: #16181f;
      --panel-light: #1e212b;
      --text-color: #e7e9ee;
      --text-muted: #9198a6;
      --accent-color: #ffffff;
      --border-color: #262a35;
      --item-hover: #1c1f29;
      --input-bg: #0d0e12;

      /* Акцент — телеграм-синий, чтобы визуально связать с Telegram */
      --accent: #3b9eff;
      --accent-hover: #59aeff;
      --accent-soft: rgba(59, 158, 255, 0.12);
      --danger: #ff6b6b;
      --warn: #ffcf5c;

      --font-ui: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Google Sans Code', 'Consolas', 'Fira Code', 'Courier New', monospace;

      --radius: 10px;
      --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.35);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

      /* Telegram (тёмная тема "Night") */
      --tg-wallpaper: #0e1621;
      --tg-bubble-in: #182533;
      --tg-text: #ffffff;
      --tg-link: #71bcf7;
      --tg-meta: rgba(255, 255, 255, 0.45);
      --tg-code-bg: rgba(0, 0, 0, 0.28);

      /* Документ-превью («бумажная» страница статьи) */
      --doc-bg: #fbfbf7;
      --doc-text: #1f2328;
      --doc-muted: #656d76;
      --doc-border: #e2e2da;
      --doc-soft: #f2f2ec;
      --doc-link: #1a66d6;
      --doc-accent: #3b9eff;
      --doc-code-bg: #eef0ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection { background: var(--accent-soft); }

    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb {
      background: #2b303c;
      border-radius: 10px;
      border: 3px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: #3a4150; background-clip: content-box; }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-color);
      background-image:
        radial-gradient(1200px 600px at 12% -10%, rgba(59, 158, 255, 0.08), transparent 60%),
        radial-gradient(1000px 500px at 110% 0%, rgba(120, 90, 255, 0.06), transparent 55%);
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-variation-settings: 'wght' 400;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Header ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: rgba(18, 19, 25, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      background-size: 200% 100%;
      opacity: 0.55;
      animation: shimmer 6s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% 0; } }

    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 0.55rem;
      letter-spacing: 0.2px;
    }
    h1 .logo {
      display: grid;
      place-items: center;
      width: 30px; height: 30px;
      border-radius: 9px;
      background: linear-gradient(140deg, var(--accent), #7a5cff);
      box-shadow: 0 4px 14px rgba(59, 158, 255, 0.35);
      font-size: 1rem;
    }

    .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; }

    .btn {
      background-color: var(--panel-light);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s var(--ease), background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .btn:hover { background-color: #262a35; border-color: #3a4150; transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #2f8bef);
      color: #fff;
      font-weight: 600;
      border: none;
      box-shadow: 0 4px 14px rgba(59, 158, 255, 0.28);
    }
    .btn-primary:hover { filter: brightness(1.07); box-shadow: 0 6px 20px rgba(59, 158, 255, 0.4); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

    #file-input { display: none; }

    main { flex: 1; padding: 1.5rem; overflow-y: auto; }

    /* ---------- Панель управления деревом ---------- */
    .tree-controls {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      animation: fadeUp 0.4s var(--ease) both;
    }
    #tree-search {
      flex: 1;
      min-width: 220px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.6rem 0.9rem;
      border-radius: 9px;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #tree-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.8rem;
      border-radius: 9px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }
    .stat-chip b { color: var(--text-color); font-weight: 600; }

    /* Баннер о дубликатах */
    .banner {
      display: none;
      margin-bottom: 1rem;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      background: rgba(255, 207, 92, 0.1);
      border: 1px solid rgba(255, 207, 92, 0.35);
      color: #ffe6a1;
      font-size: 0.86rem;
      line-height: 1.5;
      animation: fadeUp 0.4s var(--ease) both;
    }
    .banner.show { display: block; }
    .banner code { font-family: var(--font-mono); color: #fff; }

    .tree-node {
      margin-left: 1.1rem;
      border-left: 1px dashed var(--border-color);
      padding-left: 0.8rem;
      margin-top: 0.2rem;
    }

    /* Разворачиваемые узлы */
    details > summary {
      cursor: pointer;
      color: var(--text-color);
      font-weight: 600;
      padding: 0.4rem 0.55rem;
      border-radius: 7px;
      font-family: var(--font-ui);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.15rem;
      list-style: none;
      transition: background-color 0.18s;
      user-select: none;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary:hover { background-color: var(--item-hover); }
    .chev {
      display: inline-block;
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-right: 0.35rem;
      transition: transform 0.2s var(--ease);
    }
    details[open] > summary .chev { transform: rotate(90deg); }

    .sum-key { color: var(--accent-color); }
    .sum-count {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      margin-left: 0.45rem;
      padding: 0.05rem 0.4rem;
      border-radius: 20px;
      background: var(--accent-soft);
    }

    /* Листовые ключи */
    .node-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.55rem 0.85rem;
      margin: 0.28rem 0;
      border-radius: 9px;
      cursor: pointer;
      overflow: hidden;
      font-family: var(--font-ui);
      background-color: var(--panel-bg);
      border: 1px solid transparent;
      transition: transform 0.16s var(--ease), background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .node-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform 0.18s var(--ease);
    }
    .node-item:hover {
      background-color: var(--item-hover);
      border-color: var(--border-color);
      transform: translateX(3px);
      box-shadow: var(--shadow-soft);
    }
    .node-item:hover::before { transform: scaleY(1); }

    .node-key { color: var(--accent-color); font-weight: 600; white-space: nowrap; }
    .node-preview {
      color: var(--text-muted);
      flex: 1;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.85;
      font-size: 0.85rem;
    }
    .node-preview.is-null { font-style: italic; opacity: 0.5; }
    .node-edit {
      color: var(--accent);
      font-size: 0.85rem;
      opacity: 0;
      transform: translateX(4px);
      transition: opacity 0.18s, transform 0.18s;
    }
    .node-item:hover .node-edit { opacity: 1; transform: translateX(0); }

    /* Лёгкий каскад появления для первых элементов */
    .entry { animation: itemIn 0.4s var(--ease) both; }
    .entry:nth-child(n+19) { animation: none; }
    .entry:nth-child(1) { animation-delay: 0.02s; }
    .entry:nth-child(2) { animation-delay: 0.05s; }
    .entry:nth-child(3) { animation-delay: 0.08s; }
    .entry:nth-child(4) { animation-delay: 0.11s; }
    .entry:nth-child(5) { animation-delay: 0.14s; }
    .entry:nth-child(6) { animation-delay: 0.17s; }
    .entry:nth-child(7) { animation-delay: 0.20s; }
    .entry:nth-child(8) { animation-delay: 0.23s; }
    .entry:nth-child(9) { animation-delay: 0.26s; }
    .entry:nth-child(10) { animation-delay: 0.29s; }
    .entry:nth-child(11) { animation-delay: 0.32s; }
    .entry:nth-child(12) { animation-delay: 0.35s; }
    .entry:nth-child(13) { animation-delay: 0.38s; }
    .entry:nth-child(14) { animation-delay: 0.41s; }
    .entry:nth-child(15) { animation-delay: 0.44s; }
    .entry:nth-child(16) { animation-delay: 0.47s; }
    .entry:nth-child(17) { animation-delay: 0.50s; }
    .entry:nth-child(18) { animation-delay: 0.53s; }

    @keyframes itemIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- Модальное окно ---------- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(8, 9, 12, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      padding: 0;
    }
    .modal.active { display: flex; animation: overlayIn 0.2s ease both; }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-card {
      margin: 0;
      width: 100%;
      max-width: none;
      height: 100%;
      background-color: var(--bg-elev);
      border: none;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalIn 0.28s var(--ease) both;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }

    .modal-header {
      background-color: var(--panel-bg);
      padding: 0.8rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      gap: 1rem;
    }
    .modal-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-title b { color: var(--accent-color); font-weight: 600; }

    .toolbar-container {
      background-color: var(--panel-bg);
      padding: 0.6rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      gap: 1rem;
      flex-wrap: wrap;
    }
    .html-toolbar { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }

    .tag-btn {
      background-color: var(--input-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.32rem 0.6rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tag-btn:hover { background-color: var(--panel-light); border-color: var(--accent); color: #fff; transform: translateY(-1px); }
    .tag-btn:active { transform: translateY(0); }

    .tag-sep {
      width: 1px;
      align-self: stretch;
      min-height: 18px;
      background: var(--border-color);
      margin: 0 0.15rem;
    }

    .tab-switch {
      display: flex;
      position: relative;
      background-color: var(--input-bg);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border-color);
    }
    .tab-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.9rem;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .tab-btn.active { color: #fff; }
    .tab-indicator {
      position: absolute;
      top: 3px; bottom: 3px;
      border-radius: 6px;
      background: var(--panel-light);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.25s var(--ease), width 0.25s var(--ease);
    }

    .modal-body { flex: 1; padding: 1.3rem; display: flex; flex-direction: column; position: relative; min-height: 0; }

    .modal-editor {
      flex: 1;
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      outline: none;
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .modal-editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* ---------- Предпросмотр документа ---------- */
    .modal-preview {
      flex: 1;
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow-y: auto;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--input-bg);
      background-image:
        radial-gradient(900px 500px at 50% -8%, rgba(59, 158, 255, 0.06), transparent 60%);
    }

    .tg-message {
      align-self: center;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background-color: var(--doc-bg);
      color: var(--doc-text);
      border-radius: 10px;
      padding: 30px 34px 34px;
      font-family: var(--font-ui);
      font-size: 15.5px;
      line-height: 1.6;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      position: relative;
      animation: bubbleIn 0.32s var(--ease) both;
    }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }

    .tg-message > :first-child { margin-top: 0; }
    .tg-message > :last-child { margin-bottom: 0; }

    /* Инлайн-форматирование */
    .tg-message b, .tg-message strong { font-weight: 700; }
    .tg-message i, .tg-message em { font-style: italic; }
    .tg-message u, .tg-message ins { text-decoration: underline; }
    .tg-message s, .tg-message strike, .tg-message del { text-decoration: line-through; }
    .tg-message a { color: var(--doc-link); text-decoration: none; }
    .tg-message a:hover { text-decoration: underline; }
    .tg-message sub { vertical-align: sub; font-size: 0.75em; }
    .tg-message sup { vertical-align: super; font-size: 0.75em; }

    /* tg-emoji — премиум-эмодзи (показываем запасной символ внутри тега) */
    .tg-message tg-emoji { display: inline-block; font-size: 1.12em; line-height: 1; vertical-align: -0.1em; }

    /* Заголовки */
    .tg-message h1, .tg-message h2, .tg-message h3,
    .tg-message h4, .tg-message h5, .tg-message h6 {
      color: var(--doc-text);
      font-weight: 700;
      line-height: 1.25;
      margin: 1.1em 0 0.5em;
    }
    .tg-message h1 { font-size: 1.9em; }
    .tg-message h2 { font-size: 1.5em; }
    .tg-message h3 { font-size: 1.28em; }
    .tg-message h4 { font-size: 1.1em; }
    .tg-message h5 { font-size: 1em; }
    .tg-message h6 { font-size: 0.9em; color: var(--doc-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    /* Горизонтальная линия-разделитель (та же линия, что была под заголовками, но ставится где угодно) */
    .tg-message hr { border: none; border-top: 1px solid var(--doc-border); margin: 1.4em 0; }

    /* Параграфы, выноски, подписи */
    .tg-message p { margin: 0.7em 0; }
    .tg-message cite { font-style: italic; color: var(--doc-muted); }
    .tg-message aside {
      margin: 1em 0;
      padding: 0.7em 1em;
      border-left: 4px solid var(--doc-accent);
      background: var(--doc-soft);
      border-radius: 0 8px 8px 0;
      font-size: 1.05em;
      font-style: italic;
      color: #2b3138;
    }
    .tg-message footer { margin-top: 0.5em; font-size: 0.86em; color: var(--doc-muted); }

    /* Код */
    .tg-message code {
      font-family: var(--font-mono);
      background-color: var(--doc-code-bg);
      color: #b02a5b;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .tg-pre-wrap {
      background-color: var(--doc-code-bg);
      border: 1px solid var(--doc-border);
      border-radius: 8px;
      margin: 0.9em 0;
      padding: 8px 12px 10px;
      overflow: hidden;
    }
    .tg-pre-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--doc-muted);
      padding-bottom: 6px;
      margin-bottom: 7px;
      border-bottom: 1px solid var(--doc-border);
    }
    .tg-pre-copy { background: none; border: none; color: var(--doc-link); cursor: pointer; font-family: var(--font-ui); font-size: 12px; padding: 0; }
    .tg-pre-copy:hover { text-decoration: underline; }
    .tg-message pre { background: none; margin: 0; padding: 0; overflow-x: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: var(--doc-text); }
    .tg-message pre code { background: none; padding: 0; font-size: inherit; color: inherit; }

    /* Цитаты */
    .tg-message blockquote {
      border-left: 4px solid var(--doc-accent);
      background-color: var(--doc-soft);
      border-radius: 0 6px 6px 0;
      padding: 0.5em 1em;
      margin: 0.9em 0;
      color: #333a41;
    }

    /* Списки */
    .tg-message ul { list-style: disc; padding-left: 1.5em; margin: 0.7em 0; }
    .tg-message ol { list-style: decimal; padding-left: 1.7em; margin: 0.7em 0; }
    .tg-message li { margin: 0.3em 0; }
    .tg-message ul ul, .tg-message ol ol, .tg-message ul ol, .tg-message ol ul { margin: 0.3em 0; }
    .tg-message li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.2em; }

    .tg-message input[type="checkbox"] {
      width: 1em;
      height: 1em;
      margin-right: 0.45em;
      vertical-align: -0.1em;
      accent-color: var(--doc-accent);
      cursor: pointer;
    }

    /* Таблицы (формат Telegram: <table bordered>, align/valign на ячейках) */
    .tg-message table { border-collapse: collapse; margin: 1em 0; font-size: 0.95em; }
    .tg-message caption { caption-side: top; text-align: center; font-weight: 600; color: var(--doc-text); padding: 0 0 0.5em; }
    .tg-message th, .tg-message td { padding: 6px 12px; }
    .tg-message table[bordered] th, .tg-message table[bordered] td { border: 1px solid #c7c7bd; }

    /* Раскрывающийся блок (details/summary) — переопределяет стили дерева */
    .tg-message details {
      border: 1px solid var(--doc-border);
      border-radius: 8px;
      padding: 0.5em 0.9em;
      margin: 0.9em 0;
      background: var(--doc-soft);
    }
    .tg-message summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--doc-text);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4em;
      padding: 0;
      font-family: var(--font-ui);
      font-size: 1em;
    }
    .tg-message summary::-webkit-details-marker { display: none; }
    .tg-message summary::before {
      content: '▸';
      color: var(--doc-accent);
      font-size: 0.9em;
      transition: transform 0.2s var(--ease);
    }
    .tg-message details[open] > summary::before { transform: rotate(90deg); }
    .tg-message details[open] > summary { margin-bottom: 0.6em; }

    /* Спойлер */
    .tg-message .tg-spoiler, .tg-message tg-spoiler {
      border-radius: 4px;
      cursor: pointer;
      color: transparent;
      background-color: #444b54;
      background-image: radial-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px);
      background-size: 5px 5px;
      animation: spoilerMove 0.6s steps(4) infinite;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      padding: 0 3px;
    }
    .tg-message .tg-spoiler.revealed, .tg-message tg-spoiler.revealed { color: inherit; background: none; animation: none; }
    @keyframes spoilerMove { to { background-position: 10px 5px; } }

    .empty-state { text-align: center; margin-top: 4rem; color: var(--text-muted); line-height: 1.9; animation: fadeUp 0.5s var(--ease) both; }
    .empty-state .big { font-size: 2.6rem; }
    /* ---------- Мобильное меню тегов (боковая выдвижная панель) ---------- */
    /* На десктопе .tag-drawer «прозрачен» (display:contents): тулбар и вкладки
       раскладываются в .toolbar-container как раньше, а обёртка/кнопка/подложка скрыты. */
    .tag-drawer { display: contents; }
    .tag-drawer-head,
    .tag-menu-toggle,
    .tag-drawer-overlay { display: none; }

    @media (max-width: 720px) {
      /* Инлайновый тулбар прячется в панель, вместо него — кнопка-открывашка */
      .tag-menu-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background-color: var(--input-bg);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.45rem 0.85rem;
        font-family: var(--font-ui);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
      }
      .tag-menu-toggle .tmt-plus { font-size: 1.1rem; line-height: 1; color: var(--accent-color); }
      .tag-menu-toggle:active { transform: scale(0.97); }

      /* Тулбар превращается в выдвижную панель справа */
      .tag-drawer {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0; right: 0;
        z-index: 1101;
        width: min(84vw, 320px);
        height: 100%;
        background-color: var(--panel-bg);
        border-left: 1px solid var(--border-color);
        box-shadow: -14px 0 44px rgba(0, 0, 0, 0.5);
        transform: translateX(100%);
        transition: transform 0.28s var(--ease);
      }
      .tag-drawer.open { transform: translateX(0); }

      .tag-drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        padding: 0.9rem 1rem;
        font-weight: 600;
        color: var(--text-color);
        border-bottom: 1px solid var(--border-color);
      }
      .tag-drawer-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
        padding: 0.25rem 0.45rem;
        border-radius: 6px;
      }
      .tag-drawer-close:hover { background-color: var(--input-bg); color: #fff; }

      /* Кнопки тегов — прокручиваемый список внутри панели */
      .html-toolbar {
        flex: 1;
        overflow-y: auto;
        align-content: flex-start;
        padding: 0.9rem 1rem 1.3rem;
        gap: 0.45rem;
      }
      .tag-btn { font-size: 0.85rem; padding: 0.45rem 0.7rem; }

      /* Разделители групп — горизонтальные линии на всю ширину панели */
      .tag-sep {
        flex-basis: 100%;
        width: auto;
        height: 1px;
        min-height: 0;
        align-self: auto;
        margin: 0.35rem 0;
      }

      /* Затемняющая подложка под панелью (закрывает по тапу) */
      .tag-drawer-overlay {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 1100;
        background-color: rgba(8, 9, 12, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
      }
      .tag-drawer-overlay.open { opacity: 1; pointer-events: auto; }
    }

    /* ---------- Мобильное меню приложения (открыть/сохранить) ---------- */
    .app-drawer,
    .app-drawer-overlay,
    .app-menu-toggle { display: none; }

    @media (max-width: 720px) {
      /* Кнопка-гамбургер в шапке */
      .app-menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px; height: 40px;
        background-color: var(--input-bg);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1.15rem;
        line-height: 1;
        cursor: pointer;
      }
      .app-menu-toggle:active { transform: scale(0.96); }

      /* Панель приложения выезжает справа */
      .app-drawer {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0; right: 0;
        z-index: 901;
        width: min(84vw, 300px);
        height: 100%;
        background-color: var(--panel-bg);
        border-left: 1px solid var(--border-color);
        box-shadow: -14px 0 44px rgba(0, 0, 0, 0.5);
        transform: translateX(100%);
        transition: transform 0.28s var(--ease);
      }
      .app-drawer.open { transform: translateX(0); }

      .app-drawer-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        padding: 0.9rem 1rem;
        font-weight: 600;
        color: var(--text-color);
        border-bottom: 1px solid var(--border-color);
      }
      .app-drawer-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
        padding: 0.25rem 0.45rem;
        border-radius: 6px;
      }
      .app-drawer-close:hover { background-color: var(--input-bg); color: #fff; }

      /* Кнопки открыть/сохранить — вертикально, во всю ширину */
      .app-drawer .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 0.6rem;
        padding: 1rem;
      }
      .app-drawer .controls .btn { width: 100%; text-align: center; }

      /* Затемняющая подложка */
      .app-drawer-overlay {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 900;
        background-color: rgba(8, 9, 12, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
      }
      .app-drawer-overlay.open { opacity: 1; pointer-events: auto; }
    }

    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="logo">⚙️</span> HTML Yaml Editor</h1>
    <button class="app-menu-toggle" id="app-menu-toggle" onclick="toggleAppDrawer()" aria-label="Меню">☰</button>

  <!-- Боковое меню приложения: на мобилках сюда переносятся кнопки открыть/сохранить -->

  <div class="app-drawer" id="app-drawer">

  <div class="modal" id="editor-modal">
    <div class="modal-card">
      <div class="modal-header">

        <div class="controls">
          <button class="btn" onclick="closeModal()">Отмена</button>
          <button class="btn btn-primary" onclick="saveModalValue()">Сохранить значение</button>
        </div>
      </div>

      <div class="toolbar-container">
        <!-- Мобильная кнопка открытия меню тегов (скрыта на десктопе) -->
        <button class="tag-menu-toggle" id="tag-menu-toggle" onclick="toggleTagDrawer()" aria-label="Меню тегов">
          <span class="tmt-plus">＋</span><span>Теги</span>
        </button>
        <div class="tag-drawer-overlay" id="tag-drawer-overlay" onclick="closeTagDrawer()"></div>

        <div class="tag-drawer" id="tag-drawer">
          <div class="tag-drawer-head">
            <span>Вставить тег</span>
            <button class="tag-drawer-close" onclick="closeTagDrawer()" aria-label="Закрыть меню">✕</button>
          </div>
          <div class="html-toolbar" id="html-toolbar">
          <!-- Заголовки -->
          <button class="tag-btn" onclick="insertTag('h1')">&lt;h1&gt;</button>
          <button class="tag-btn" onclick="insertTag('h2')">&lt;h2&gt;</button>
          <button class="tag-btn" onclick="insertTag('h3')">&lt;h3&gt;</button>
          <button class="tag-btn" onclick="insertTag('h4')">&lt;h4&gt;</button>
          <button class="tag-btn" onclick="insertTag('h5')">&lt;h5&gt;</button>
          <button class="tag-btn" onclick="insertTag('h6')">&lt;h6&gt;</button>
          <span class="tag-sep"></span>
          <!-- Блоки и цитирование -->
          <button class="tag-btn" onclick="insertTag('p')">&lt;p&gt;</button>
          <button class="tag-btn" onclick="insertTag('blockquote')">&lt;blockquote&gt;</button>
          <button class="tag-btn" onclick="insertTag('cite')">&lt;cite&gt;</button>
          <button class="tag-btn" onclick="insertTag('aside')">&lt;aside&gt;</button>
          <button class="tag-btn" onclick="insertTag('footer')">&lt;footer&gt;</button>
          <button class="tag-btn" onclick="insertCustom('<hr/>', '')">&lt;hr/&gt;</button>

          <button class="tag-btn" onclick="insertTag('sub')">&lt;sub&gt;</button>
          <button class="tag-btn" onclick="insertTag('sup')">&lt;sup&gt;</button>
          <button class="tag-btn" onclick="insertTag('a', 'href=&quot;https://example.com&quot;')">&lt;a&gt;</button>
          <span class="tag-sep"></span>
          <!-- Списки и интерактив -->
          <button class="tag-btn" onclick="insertCustom('<ul>\n  <li>', '</li>\n</ul>')">&lt;ul&gt;</button>
          <button class="tag-btn" onclick="insertCustom('<ol>\n  <li>', '</li>\n</ol>')">&lt;ol&gt;</button>
          <button class="tag-btn" onclick="insertTag('li')">&lt;li&gt;</button>
          <button class="tag-btn" onclick="insertTag('input', 'type=&quot;checkbox&quot;', true)">чекбокс</button>
          <button class="tag-btn" onclick="insertCustom('<details>\n  <summary>Заголовок</summary>\n  ', '\n</details>')">&lt;details&gt;</button>
          <button class="tag-btn" onclick="insertTag('summary')">&lt;summary&gt;</button>
          <span class="tag-sep"></span>
          <!-- Таблицы -->
          <button class="tag-btn" onclick="insertCustom('<table bordered>\n  <caption><b>Заголовок</b></caption>\n  <tr><td align=&quot;left&quot; valign=&quot;top&quot;>', '</td><td align=&quot;left&quot; valign=&quot;top&quot;></td></tr>\n  <tr><td align=&quot;left&quot; valign=&quot;top&quot;></td><td align=&quot;left&quot; valign=&quot;top&quot;></td></tr>\n</table>')">&lt;table&gt;</button>
          <button class="tag-btn" onclick="insertTag('caption')">&lt;caption&gt;</button>
          <button class="tag-btn" onclick="insertTag('tr')">&lt;tr&gt;</button>
          <button class="tag-btn" onclick="insertTag('th')">&lt;th&gt;</button>
          <button class="tag-btn" onclick="insertTag('td', 'align=&quot;left&quot; valign=&quot;top&quot;')">&lt;td&gt;</button>
          <span class="tag-sep"></span>
          <!-- Кастомные -->
          <button class="tag-btn" onclick="insertTag('tg-time', 'unix=&quot;1647531900&quot;')">&lt;tg-time&gt;</button>
          <button class="tag-btn" onclick="insertTag('tg-spoiler')">&lt;tg-spoiler&gt;</button>
          <button class="tag-btn" onclick="insertTag('tg-emoji', 'emoji-id=&quot;5368324170671202286&quot;')">&lt;tg-emoji&gt;</button>
          </div>
        </div>

        <div class="tab-switch">
          <div class="tab-indicator" id="tab-indicator"></div>
          <button class="tab-btn active" id="btn-mode-edit" onclick="switchMode('edit')">HTML Код</button>
          <button class="tab-btn" id="btn-mode-preview" onclick="switchMode('preview')">Предпросмотр</button>
        </div>

      <div class="modal-body">
        <textarea class="modal-editor" id="modal-textarea" placeholder="Введите текст или Telegram HTML..."></textarea>
        <div class="modal-preview hidden" id="modal-preview"></div>

  <script>
    let parsedData = null;
    let currentFileName = 'config.yaml';
    let activeTarget = null;

    const fileInput = document.getElementById('file-input');
    const treeContainer = document.getElementById('tree-container');
    const treeControls = document.getElementById('tree-controls');
    const treeSearch = document.getElementById('tree-search');
    const statCount = document.getElementById('stat-count');
    const dupBanner = document.getElementById('dup-banner');
    const saveBtn = document.getElementById('save-btn');
    const modal = document.getElementById('editor-modal');
    const modalKeyPath = document.getElementById('modal-key-path');
    const modalTextarea = document.getElementById('modal-textarea');
    const modalPreview = document.getElementById('modal-preview');
    const htmlToolbar = document.getElementById('html-toolbar');
    const tabIndicator = document.getElementById('tab-indicator');

    /* ---------- Загрузка ---------- */
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        currentFileName = file.name;
        const reader = new FileReader();
        reader.onload = (ev) => loadYAMLString(ev.target.result);
        reader.readAsText(file, 'UTF-8');
      }
      fileInput.value = ''; // позволяет открыть тот же файл повторно
    });

    function loadYAMLString(yamlString) {
      let data;
      let duplicates = [];
      try {
        // Строгий разбор: js-yaml КИДАЕТ исключение на дубликатах ключей —
        // именно так ключи "теряются" (побеждает последний). Ловим это.
        data = jsyaml.load(yamlString);
      } catch (err) {
        if (/duplicat/i.test(err.message || '')) {
          duplicates = collectDuplicates(yamlString);
          // Лениво перечитываем — оставляем последнее значение, но предупреждаем
          try {
            data = jsyaml.load(yamlString, { json: true });
          } catch (e2) {
            alert('Ошибка синтаксиса YAML: ' + e2.message);
            return;
          }
        } else {
          // Возможно многодокументный файл (---)
          try {
            const docs = jsyaml.loadAll(yamlString, null, { json: true });
            data = docs.length > 1 ? docs : jsyaml.load(yamlString, { json: true });
          } catch (e3) {
            alert('Ошибка синтаксиса YAML: ' + err.message);
            return;
          }
        }
      }
      parsedData = data;
      renderTree();
      showDuplicates(duplicates);
    }

    // Ищет дубликаты ключей внутри одного и того же уровня (по отступам)
    function collectDuplicates(text) {
      const lines = text.split(/\r?\n/);
      const scopes = [{ indent: -1, keys: new Map() }];
      const dups = [];
      for (let i = 0; i < lines.length; i++) {
        const raw = lines[i];
        if (!raw.trim() || /^\s*#/.test(raw) || /^\s*-/.test(raw)) continue;
        const m = raw.match(/^(\s*)(?:"([^"]+)"|'([^']+)'|([^:#\s][^:]*?))\s*:(\s|$)/);
        if (!m) continue;
        const indent = m[1].length;
        const key = (m[2] ?? m[3] ?? m[4] ?? '').trim();
        while (scopes.length > 1 && scopes[scopes.length - 1].indent > indent) scopes.pop();
        let top = scopes[scopes.length - 1];
        if (indent > top.indent) { top = { indent, keys: new Map() }; scopes.push(top); }
        if (top.keys.has(key)) dups.push({ key, line: i + 1, first: top.keys.get(key) });
        else top.keys.set(key, i + 1);
      }
      return dups;
    }

    function showDuplicates(dups) {
      if (!dups || !dups.length) { dupBanner.classList.remove('show'); dupBanner.innerHTML = ''; return; }
      const list = dups.slice(0, 12)
        .map((d) => `<code>${escapeHtml(d.key)}</code> (строки ${d.first} и ${d.line})`)
        .join(', ');
      const more = dups.length > 12 ? ` и ещё ${dups.length - 12}` : '';
      dupBanner.innerHTML =
        `⚠ Найдены повторяющиеся ключи — YAML оставляет только последнее значение, ` +
        `поэтому часть ключей могла «пропасть». Дубликаты: ${list}${more}. ` +
        `Исправьте их в исходном файле, чтобы ничего не потерять.`;
      dupBanner.classList.add('show');
    }

    /* ---------- Утилиты ---------- */
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function cleanPreview(val) {
      if (val === null) return '~ (пусто)';
      if (val === undefined) return '';
      return String(val).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
    }

    function countAllKeys(o) {
      let n = 0;
      for (const k in o) {
        if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
        n++;
        const v = o[k];
        if (v && typeof v === 'object') n += countAllKeys(v);
      }
      return n;
    }

    /* ---------- Рендер дерева ---------- */
    function renderTree() {
      treeContainer.innerHTML = '';
      const hasData = parsedData !== null && typeof parsedData === 'object';
      treeControls.classList.toggle('hidden', !hasData);
      saveBtn.disabled = parsedData === null;

      if (!hasData) {
        treeContainer.innerHTML = '<div class="empty-state">Пустой или некорректный файл</div>';
        return;
      }
      statCount.textContent = countAllKeys(parsedData);
      treeContainer.appendChild(buildTree(parsedData, ''));
      if (treeSearch.value.trim()) filterTree(treeSearch.value.trim().toLowerCase());
    }

    function buildTree(data, path) {
      const fragment = document.createDocumentFragment();
      for (const key in data) {
        if (!Object.prototype.hasOwnProperty.call(data, key)) continue;

        const val = data[key];
        const currentPath = path ? `${path} → ${key}` : String(key);
        const entry = document.createElement('div');
        entry.className = 'entry';

        if (val !== null && typeof val === 'object') {
          const details = document.createElement('details');
          details.open = true; // все ключи видны сразу

          const summary = document.createElement('summary');
          summary.dataset.key = String(key).toLowerCase();
          const count = Array.isArray(val) ? `[${val.length}]` : `{${Object.keys(val).length}}`;
          summary.innerHTML =
            `<span class="chev">▶</span>` +
            `<span class="sum-key">${escapeHtml(key)}</span>` +
            `<span class="sum-count">${count}</span>`;

          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'tree-node';
          childrenContainer.appendChild(buildTree(val, currentPath));

          details.appendChild(summary);
          details.appendChild(childrenContainer);
          entry.appendChild(details);
        } else {
          const nodeItem = document.createElement('div');
          nodeItem.className = 'node-item';
          nodeItem.dataset.search = (String(key) + ' ' + String(val ?? '')).toLowerCase();

          const keySpan = document.createElement('span');
          keySpan.className = 'node-key';
          keySpan.textContent = key;

          const previewSpan = document.createElement('span');
          previewSpan.className = 'node-preview';
          if (val === null) previewSpan.classList.add('is-null');
          previewSpan.textContent = cleanPreview(val);

          const edit = document.createElement('span');
          edit.className = 'node-edit';
          edit.textContent = '✎';

          nodeItem.appendChild(keySpan);
          nodeItem.appendChild(previewSpan);
          nodeItem.appendChild(edit);
          nodeItem.addEventListener('click', () => openModal(data, key, currentPath, previewSpan, nodeItem));
          entry.appendChild(nodeItem);
        }
        fragment.appendChild(entry);
      }
      return fragment;
    }

    /* ---------- Поиск / сворачивание ---------- */
    function filterTree(term) {
      treeContainer.querySelectorAll(':scope > .entry').forEach((entry) => matchEntry(entry, term));
    }
    function matchEntry(entry, term) {
      const details = entry.querySelector(':scope > details');
      if (details) {
        const summary = details.querySelector(':scope > summary');
        const keyMatch = (summary.dataset.key || '').includes(term);
        let childMatch = false;
        details.querySelectorAll(':scope > .tree-node > .entry').forEach((child) => {
          if (matchEntry(child, term)) childMatch = true;
        });
        const visible = term === '' || keyMatch || childMatch;
        entry.style.display = visible ? '' : 'none';
        if (term !== '') details.open = keyMatch || childMatch;
        return visible;
      }
      const item = entry.querySelector(':scope > .node-item');
      const visible = term === '' || (item.dataset.search || '').includes(term);
      entry.style.display = visible ? '' : 'none';
      return visible;
    }

    treeSearch.addEventListener('input', () => filterTree(treeSearch.value.trim().toLowerCase()));
    document.getElementById('expand-all').addEventListener('click', () => {
      treeContainer.querySelectorAll('details').forEach((d) => (d.open = true));
    });
    document.getElementById('collapse-all').addEventListener('click', () => {
      treeContainer.querySelectorAll('details').forEach((d) => (d.open = false));
    });

    /* ---------- Вставка тегов ---------- */
    function insertTag(tag, attrs = '', isSingle = false) {
      const start = modalTextarea.selectionStart;
      const end = modalTextarea.selectionEnd;
      const text = modalTextarea.value;
      const selectedText = text.substring(start, end);
      const openTag = `<${tag}${attrs ? ' ' + attrs : ''}>`;
      const closeTag = `</${tag}>`;
      const replacement = isSingle ? openTag : `${openTag}${selectedText}${closeTag}`;
      modalTextarea.value = text.substring(0, start) + replacement + text.substring(end);
      modalTextarea.focus();
      if (!isSingle) {
        modalTextarea.selectionStart = start + openTag.length;
        modalTextarea.selectionEnd = modalTextarea.selectionStart + selectedText.length;
      }
      closeTagDrawer();
    }
    function insertCustom(openStr, closeStr) {
      const start = modalTextarea.selectionStart;
      const end = modalTextarea.selectionEnd;
      const text = modalTextarea.value;
      const selectedText = text.substring(start, end);
      modalTextarea.value = text.substring(0, start) + `${openStr}${selectedText}${closeStr}` + text.substring(end);
      modalTextarea.focus();
      modalTextarea.selectionStart = start + openStr.length;
      modalTextarea.selectionEnd = modalTextarea.selectionStart + selectedText.length;
      closeTagDrawer();
    }

    /* ---------- Мобильное меню тегов ---------- */
    const tagDrawer = document.getElementById('tag-drawer');
    const tagDrawerOverlay = document.getElementById('tag-drawer-overlay');
    const tagMenuToggle = document.getElementById('tag-menu-toggle');
    function openTagDrawer() {
      tagDrawer.classList.add('open');
      tagDrawerOverlay.classList.add('open');
    }
    function closeTagDrawer() {
      tagDrawer.classList.remove('open');
      tagDrawerOverlay.classList.remove('open');
    }
    function toggleTagDrawer() {
      if (tagDrawer.classList.contains('open')) closeTagDrawer();
      else openTagDrawer();
    }

    /* ---------- Мобильное меню приложения (открыть/сохранить) ---------- */
    const appDrawer = document.getElementById('app-drawer');
    const appDrawerOverlay = document.getElementById('app-drawer-overlay');
    const appControls = document.getElementById('app-controls');
    const appHeader = document.querySelector('header');
    const appMenuMedia = window.matchMedia('(max-width: 720px)');
    function openAppDrawer() {
      appDrawer.classList.add('open');
      appDrawerOverlay.classList.add('open');
    }
    function closeAppDrawer() {
      appDrawer.classList.remove('open');
      appDrawerOverlay.classList.remove('open');
    }
    function toggleAppDrawer() {
      if (appDrawer.classList.contains('open')) closeAppDrawer();
      else openAppDrawer();
    }
    // На мобилках кнопки переезжают в боковую панель, на десктопе — обратно в шапку.
    function placeAppControls() {
      if (appMenuMedia.matches) {
        appDrawer.appendChild(appControls);
      } else {
        appHeader.appendChild(appControls);
        closeAppDrawer();
      }
    }
    appMenuMedia.addEventListener('change', placeAppControls);
    placeAppControls();

    /* ---------- Telegram-предпросмотр ---------- */
    // Рендерим значение как документ: поддерживаемые теги стилизуются в превью,
    // переносы строк в тексте превращаются в <br>.
    function renderTelegramInto(el, raw) {
      el.innerHTML = raw; // браузер разбирает HTML; переносы строк — это пробельные узлы

      // 1) Переносы строк в ТЕКСТЕ -> <br>; пробельные "щели" между блоками убираем.
      //    Внутри <pre> переносы не трогаем (их отображает white-space: pre-wrap).
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach((tn) => {
        if (tn.parentElement && tn.parentElement.closest('pre')) return;
        if (!/\n/.test(tn.nodeValue)) return;
        if (!tn.nodeValue.trim()) { tn.nodeValue = ''; return; }
        const parts = tn.nodeValue.split('\n');
        const frag = document.createDocumentFragment();
        parts.forEach((p, i) => {
          frag.appendChild(document.createTextNode(p));
          if (i < parts.length - 1) frag.appendChild(document.createElement('br'));
        });
        tn.replaceWith(frag);
      });

      // 2) tg-time -> локализованная дата
      el.querySelectorAll('tg-time').forEach((t) => {
        const unix = parseInt(t.getAttribute('unix') || '0', 10);
        if (unix > 0) t.textContent = new Date(unix * 1000).toLocaleString('ru-RU');
      });

      // 3) Блоки кода -> шапка + кнопка "Копировать"
      enhancePre(el);

      // 4) Спойлеры раскрываются по клику
      el.querySelectorAll('.tg-spoiler, tg-spoiler').forEach((sp) => {
        sp.addEventListener('click', () => sp.classList.toggle('revealed'));
      });

      // 5) Чекбоксы (списки задач) можно переключать прямо в превью
      el.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.addEventListener('change', () => {
          if (cb.checked) cb.setAttribute('checked', '');
          else cb.removeAttribute('checked');
        });
      });
    }

    function enhancePre(root) {
      root.querySelectorAll('pre').forEach((pre) => {
        if (pre.closest('.tg-pre-wrap')) return;
        const code = pre.querySelector('code');
        let lang = '';
        if (code) {
          const m = (code.className || '').match(/language-([\w+#.-]+)/i);
          if (m) lang = m[1];
        }
        const wrap = document.createElement('div');
        wrap.className = 'tg-pre-wrap';
        const header = document.createElement('div');
        header.className = 'tg-pre-header';
        const label = document.createElement('span');
        label.textContent = lang || 'code';
        const copy = document.createElement('button');
        copy.className = 'tg-pre-copy';
        copy.type = 'button';
        copy.textContent = 'Копировать';
        copy.addEventListener('click', () => {
          const txt = code ? code.textContent : pre.textContent;
          if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
          copy.textContent = 'Скопировано';
          setTimeout(() => (copy.textContent = 'Копировать'), 1200);
        });
        header.appendChild(label);
        header.appendChild(copy);
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(header);
        wrap.appendChild(pre);
      });
    }

    function moveTabIndicator(activeBtn) {
      tabIndicator.style.width = activeBtn.offsetWidth + 'px';
      tabIndicator.style.transform = `translateX(${activeBtn.offsetLeft - 3}px)`;
    }

    function switchMode(mode) {
      const editBtn = document.getElementById('btn-mode-edit');
      const previewBtn = document.getElementById('btn-mode-preview');

      if (mode === 'preview') {
        modalPreview.innerHTML = '';
        const page = document.createElement('div');
        page.className = 'tg-message';
        renderTelegramInto(page, modalTextarea.value);
        modalPreview.appendChild(page);

        modalTextarea.classList.add('hidden');
        modalPreview.classList.remove('hidden');
        htmlToolbar.classList.add('hidden');
        tagMenuToggle.classList.add('hidden');
        closeTagDrawer();
        previewBtn.classList.add('active');
        editBtn.classList.remove('active');
        moveTabIndicator(previewBtn);
      } else {
        modalTextarea.classList.remove('hidden');
        modalPreview.classList.add('hidden');
        htmlToolbar.classList.remove('hidden');
        tagMenuToggle.classList.remove('hidden');
        editBtn.classList.add('active');
        previewBtn.classList.remove('active');
        moveTabIndicator(editBtn);
      }
    }

    /* ---------- Модалка ---------- */
    function openModal(parentObject, key, fullPath, previewEl, nodeItem) {
      activeTarget = { obj: parentObject, key, previewEl, nodeItem };
      modalKeyPath.innerHTML = 'Ключ: <b>' + escapeHtml(fullPath) + '</b>';
      const v = parentObject[key];
      modalTextarea.value = v === undefined || v === null ? '' : String(v);
      switchMode('edit');
      modal.classList.add('active');
      requestAnimationFrame(() => moveTabIndicator(document.getElementById('btn-mode-edit')));
      modalTextarea.focus();
    }

    function closeModal() {
      modal.classList.remove('active');
      closeTagDrawer();
      activeTarget = null;
    }

    function saveModalValue() {
      if (activeTarget) {
        const raw = modalTextarea.value;
        const orig = activeTarget.obj[activeTarget.key];
        let out;
        // Сохраняем исходный тип, чтобы не портить данные
        // (большие ID, ведущие нули, текст "true" остаются строками).
        if (typeof orig === 'boolean') {
          out = raw === 'true' ? true : raw === 'false' ? false : raw;
        } else if (typeof orig === 'number') {
          const n = Number(raw);
          out = raw.trim() !== '' && !isNaN(n) && String(n) === raw.trim() ? n : raw;
        } else if (orig === null || orig === undefined) {
          out = raw === '' ? null : raw;
        } else {
          out = raw;
        }
        activeTarget.obj[activeTarget.key] = out;

        if (activeTarget.previewEl) {
          activeTarget.previewEl.textContent = cleanPreview(out);
          activeTarget.previewEl.classList.toggle('is-null', out === null);
        }
        if (activeTarget.nodeItem) {
          activeTarget.nodeItem.dataset.search =
            (String(activeTarget.key) + ' ' + String(out ?? '')).toLowerCase();
        }
      }
      closeModal();
    }

    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') closeModal();
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') saveModalValue();
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    /* ---------- Сохранение YAML ---------- */
    saveBtn.addEventListener('click', () => {
      closeAppDrawer();
      if (parsedData === null) return;
      try {
        const yamlOutput = jsyaml.dump(parsedData, { lineWidth: -1, noRefs: true });
        const blob = new Blob([yamlOutput], { type: 'text/yaml;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = currentFileName;
        link.click();
        URL.revokeObjectURL(link.href);
      } catch (err) {
        alert('Ошибка при сохранении: ' + err.message);
      }
    });
  </script>
</body>
